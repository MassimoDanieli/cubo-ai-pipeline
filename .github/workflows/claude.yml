# Agentic assistant on demand: write "@claude ..." in a PR or issue comment
# (e.g. "@claude aggiungi un test per i numeri decimali") and Claude Code runs
# on the runner, reads the repo, runs the tests and answers or pushes a fix.
# Setup: install https://github.com/apps/claude on the repo; uses ANTHROPIC_API_KEY.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
