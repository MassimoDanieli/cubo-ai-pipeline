            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'

            - name: Install Python dependencies
              run: |
                pip install -r requirements.txt
                pip install openai

            - name: Generate JS tests with GPT
              env:
                OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
              run: python3 scripts/generate_js_test.py
      - name: Run Jest coverage
        run: npx jest --coverage
name: Run JS Tests

on:
  pull_request:
    paths:
      - "__tests__/*.js"
      - "**/*.html"
      - "**/*.js"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npx eslint .

      - name: Run Jest tests
        run: npx jest

